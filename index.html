<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permainan Tradisional</title>
    <style>
        /* Paksa window iframe agar tidak memunculkan scrollbar internal */
        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: auto !important;
            overflow: hidden !important;
            /* Mematikan scrollbar internal iframe */
            background-color: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .gallery-container {
            max-width: 100%;
            margin: 0 auto;
            text-align: center;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            overflow: visible !important;
            /* Biarkan konten mengalir alami tanpa scroll tersendiri */
        }

        .slide-title {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .image-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            width: 100%;
            max-width: 356px;
            border-radius: 8px;
            object-fit: cover;
            transition: opacity 0.3s ease-in-out;
        }

        .btn-nav {
            position: absolute;
            background-color: rgba(211, 84, 0, 0.85);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
            z-index: 10;
        }

        .btn-nav:hover {
            background-color: rgba(160, 64, 0, 1);
        }

        .prev {
            left: 5px;
        }

        .next {
            right: 5px;
        }

        .slide-desc {
            font-size: 0.9rem;
            color: #666;
            margin-top: 15px;
            line-height: 1.5;
            text-align: justify;
        }
    </style>
</head>

<body>

    <div class="gallery-container">
        <!-- Judul akan berubah otomatis -->
        <div class="slide-title" id="judul-hewan">Memuat...</div>

        <div class="image-wrapper">
            <!-- Tombol Before / Prev -->
            <button class="btn-nav prev" id="btn-prev" onclick="gantiSlide(-1)">&#10094;</button>

            <!-- Gambar utama -->
            <img id="gambar-hewan" src="" alt="Koleksi Museum">

            <!-- Tombol Next -->
            <button class="btn-nav next" id="btn-next" onclick="gantiSlide(1)">&#10095;</button>
        </div>

        <!-- Keterangan akan berubah otomatis -->
        <div class="slide-desc" id="keterangan-hewan">Memuat keterangan...</div>
    </div>

    <script>
        // 1. Tempat lu masukin Judul, Link Gambar, dan Keterangan
        // Cukup edit teks di dalam tanda kutip ini aja ya
        const koleksiData = [
            {
                judul: "Gasing",
                gambar: "gasing.jpg",
                keterangan: "Gasing Terbuat dari kayu bentuk lonjong, bagian atas rata dan bawah bentuk kerucut (lancip) berfungsi sebagai tempat melingkarkan tali. Ukuran : T = 6,5 cm Kll = 13,5 cm"
            },
            {
                judul: "K Congklak",
                gambar: "congklak.jpg",
                keterangan: "Congklak (Dakon) Terbuat dari kayu bentuk panjang dengan hiasan dua ayam jago saling bertolak belakang. Mempunyai 18 buah lubang sawah dan dua buah lumbung, dibawahnya ditopang oleh empat buah kaki ayam. Keseluruh dakon dicat warna kuning keemasan dan merah. Ukuran : P = 103,5 cm L = 15 cm T = 50,5 cm"
            }
        ];

        let indexSekarang = 0;

        // Ambil elemen HTML yang akan dimanipulasi
        const elemenJudul = document.getElementById('judul-hewan');
        const elemenGambar = document.getElementById('gambar-hewan');
        const elemenKeterangan = document.getElementById('keterangan-hewan');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function updateTampilan() {
            // Ganti konten sesuai data array
            elemenJudul.innerText = koleksiData[indexSekarang].judul;
            elemenGambar.src = koleksiData[indexSekarang].gambar;
            elemenKeterangan.innerText = koleksiData[indexSekarang].keterangan;

            // Logika sesuai revisi dosen:
            // Sembunyikan tombol Prev jika sedang di gambar urutan pertama (index 0)
            if (indexSekarang === 0) {
                btnPrev.style.display = 'none';
            } else {
                btnPrev.style.display = 'flex';
            }

            // Sembunyikan tombol Next jika sedang di gambar urutan terakhir
            if (indexSekarang === koleksiData.length - 1) {
                btnNext.style.display = 'none';
            } else {
                btnNext.style.display = 'flex';
            }
        }

        function gantiSlide(arah) {
            indexSekarang += arah;
            updateTampilan();
        }

        // Jalankan fungsi saat web pertama kali dirender
        updateTampilan();
    </script>

</body>

</html>
